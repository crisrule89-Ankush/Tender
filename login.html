<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09234b">
  <title>User Login | Escon Elevators</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro" aria-label="Escon Elevators">
      <img class="login-company-logo" src="/assets/escon-logo.png" alt="Escon Elevators Pvt. Ltd. — Customized Elevating Solutions">
    </section>
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-brand">
        <div class="login-brand-wordmark" aria-label="Escon">
          <span class="login-brand-emblem" aria-hidden="true"><i></i></span>SCON
        </div>
        <h1>Escon Elevators Pvt. Ltd.</h1>
        <p class="login-tagline"><span></span>Customized Elevating Solutions<span></span></p>
        <p class="login-heading" id="login-title">USER LOGIN</p>
      </header>
      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <div class="login-input-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 8a8 8 0 0 1 16 0v1H4v-1Z"/></svg>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter Username" required maxlength="256">
        </div>
        <label for="password">Password</label>
        <div class="login-input-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Zm2 0h6V7a3 3 0 0 0-6 0v3Zm3 4a2 2 0 0 0-1 3.73V19h2v-1.27A2 2 0 0 0 12 14Z"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter Password" required>
          <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password">Show</button>
        </div>
        <div class="login-options">
          <label class="remember-option" for="remember-me">
            <input id="remember-me" name="rememberMe" type="checkbox">
            <span>Remember Me</span>
          </label>
          <button class="forgot-password" id="forgot-password" type="button">Forgot Password?</button>
        </div>
        <div class="form-message" id="login-message" role="alert" aria-live="polite"></div>
        <button class="button button-primary button-wide login-submit" id="login-button" type="submit">
          <span class="login-submit-icon" aria-hidden="true">➜</span>Login
        </button>
      </form>
      <div class="login-secure"><span aria-hidden="true">⬟</span>Your data is safe and secure</div>
    </section>
  </main>
  <script src="/appearance.js" defer></script>
  <script src="/login.js" defer></script>
</body>
</html>
